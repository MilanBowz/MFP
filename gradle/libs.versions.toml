[versions]
agp = "9.4.1"
appcompat = "1.7.1"
glide = "5.0.5"
jaudiotagger = "2.0.3"
kotlinxCoroutinesAndroid = "1.11.0"
material = "1.13.0"
activity = "1.12.2"
constraintlayout = "2.2.1"
legacySupportV4 = "1.0.0"
mediaVersion = "1.8.0"
recyclerview = "1.4.0"
navigationFragment = "2.9.6"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
jaudiotagger = { module = "org:jaudiotagger", version.ref = "jaudiotagger" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigationFragment" }
legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacySupportV4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }